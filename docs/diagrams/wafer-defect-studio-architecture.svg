<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wafer-architecture-title wafer-architecture-desc">
      <title id="wafer-architecture-title">Wafer Defect Studio architecture</title>
      <desc id="wafer-architecture-desc">Architecture showing an algorithm engineer using PySide6 workspaces, a single-writer project service coordinating SQLite and worker processes, and validated filesystem artifacts.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f6f8fb"/>

      <!-- Zones -->
      <rect x="232" y="156" width="460" height="352" rx="8" fill="#172033" fill-opacity="0.02" stroke="#172033" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="244" y="160" width="88" height="16" rx="4" fill="#f6f8fb"/>
      <text x="288" y="172" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">APPLICATION</text>

      <rect x="712" y="156" width="220" height="352" rx="8" fill="#172033" fill-opacity="0.02" stroke="#172033" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="724" y="160" width="72" height="16" rx="4" fill="#f6f8fb"/>
      <text x="760" y="172" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">COMPUTE</text>

      <!-- Connectors -->
      <line x1="200" y1="260" x2="252" y2="260" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="432" y1="260" x2="492" y2="260" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="672" y1="260" x2="732" y2="260" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="552" y1="296" x2="552" y2="396" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="296" x2="792" y2="396" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 732 432 H 704 Q 696 432 696 424 V 344 Q 696 336 688 336 H 620 Q 612 336 612 328 V 296" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels -->
      <rect x="208" y="236" width="36" height="12" rx="4" fill="#f6f8fb"/>
      <text x="226" y="244" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">USES</text>

      <rect x="436" y="236" width="52" height="12" rx="4" fill="#f6f8fb"/>
      <text x="462" y="244" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">COMMANDS</text>

      <rect x="680" y="236" width="44" height="12" rx="4" fill="#f6f8fb"/>
      <text x="702" y="244" fill="#1d4ed8" font-size="8" font-family="Consolas, monospace" text-anchor="middle">STARTS</text>

      <rect x="564" y="340" width="44" height="12" rx="4" fill="#f6f8fb"/>
      <text x="586" y="348" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">WRITES</text>

      <rect x="804" y="340" width="44" height="12" rx="4" fill="#f6f8fb"/>
      <text x="826" y="348" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">STAGES</text>

      <rect x="624" y="312" width="64" height="12" rx="4" fill="#f6f8fb"/>
      <text x="656" y="320" fill="#1d4ed8" font-size="8" font-family="Consolas, monospace" text-anchor="middle">VALIDATES</text>

      <!-- Algorithm Engineer -->
      <rect x="40" y="224" width="160" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="40" y="224" width="160" height="72" rx="8" fill="#475569" fill-opacity="0.08" stroke="#94a3b8" stroke-width="1"/>
      <rect x="52" y="232" width="40" height="12" rx="4" fill="none" stroke="#475569" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="72" y="240" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">USER</text>
      <text x="120" y="264" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">Algorithm Engineer</text>
      <text x="120" y="280" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">review · approval</text>

      <!-- PySide6 Workspaces -->
      <rect x="252" y="224" width="180" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="252" y="224" width="180" height="72" rx="8" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <rect x="264" y="232" width="32" height="12" rx="4" fill="none" stroke="#172033" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="280" y="240" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">GUI</text>
      <text x="342" y="264" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">PySide6 Workspaces</text>
      <text x="342" y="280" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">data · train · review</text>

      <!-- Project Service -->
      <rect x="492" y="224" width="180" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="492" y="224" width="180" height="72" rx="8" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.2"/>
      <rect x="504" y="232" width="56" height="12" rx="4" fill="none" stroke="#1d4ed8" stroke-opacity="0.48" stroke-width="0.8"/>
      <text x="532" y="240" fill="#1d4ed8" font-size="8" font-family="Consolas, monospace" text-anchor="middle">SERVICE</text>
      <text x="582" y="264" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">Project Service</text>
      <text x="582" y="280" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">single SQLite writer</text>

      <!-- Worker Processes -->
      <rect x="732" y="224" width="180" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="732" y="224" width="180" height="72" rx="8" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <rect x="744" y="232" width="48" height="12" rx="4" fill="none" stroke="#172033" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="768" y="240" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">WORKER</text>
      <text x="822" y="264" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">Worker Processes</text>
      <text x="822" y="280" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">train · evaluate · detect</text>

      <!-- SQLite Metadata -->
      <rect x="492" y="396" width="180" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="492" y="396" width="180" height="72" rx="8" fill="#172033" fill-opacity="0.05" stroke="#475569" stroke-width="1"/>
      <rect x="504" y="404" width="40" height="12" rx="4" fill="none" stroke="#475569" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="524" y="412" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">STORE</text>
      <text x="582" y="436" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">SQLite Metadata</text>
      <text x="582" y="452" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">project state · provenance</text>

      <!-- Filesystem Artifacts -->
      <rect x="732" y="396" width="180" height="72" rx="8" fill="#f6f8fb"/>
      <rect x="732" y="396" width="180" height="72" rx="8" fill="#172033" fill-opacity="0.05" stroke="#475569" stroke-width="1"/>
      <rect x="744" y="404" width="40" height="12" rx="4" fill="none" stroke="#475569" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="764" y="412" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">STORE</text>
      <text x="822" y="436" fill="#172033" font-size="12" font-weight="600" font-family="Segoe UI, sans-serif" text-anchor="middle">Filesystem Artifacts</text>
      <text x="822" y="452" fill="#475569" font-size="8" font-family="Consolas, monospace" text-anchor="middle">models · runs · maps · exports</text>

      <!-- Legend -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="#172033" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="40" y="560" fill="#475569" font-size="8" font-family="Consolas, monospace" letter-spacing="0.12em">LEGEND</text>
      <rect x="132" y="548" width="16" height="12" rx="4" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <text x="160" y="560" fill="#475569" font-size="8" font-family="Segoe UI, sans-serif">Application component</text>
      <rect x="320" y="548" width="16" height="12" rx="4" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1"/>
      <text x="348" y="560" fill="#475569" font-size="8" font-family="Segoe UI, sans-serif">Single-writer boundary</text>
      <rect x="520" y="548" width="16" height="12" rx="4" fill="#172033" fill-opacity="0.05" stroke="#475569" stroke-width="1"/>
      <text x="548" y="560" fill="#475569" font-size="8" font-family="Segoe UI, sans-serif">Persisted state</text>
      <line x1="704" y1="554" x2="744" y2="554" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="756" y="560" fill="#475569" font-size="8" font-family="Segoe UI, sans-serif">Validated publication</text>
    </svg>
