[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-defect-studio"
version = "0.1.0"
description = "A desktop tool for wafer defect classification"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.scripts]
wafer-defect-studio = "wafer_defect_studio.application:main"

[tool.setuptools.packages.find]
where = ["src"]
